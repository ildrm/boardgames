name: Tablemate checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose --profile replicas up -d --build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:e2e
        env:
          TABLEMATE_TEST_BROWSER: firefox
      - run: pnpm test:e2e
        env:
          TABLEMATE_TEST_BROWSER: webkit
      - if: failure()
        run: docker compose --profile replicas logs --no-color
