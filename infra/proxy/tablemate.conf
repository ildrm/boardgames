map $http_upgrade $tablemate_connection {
    default upgrade;
    '' close;
}

upstream tablemate_api {
    zone tablemate_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:3000 resolve;
    server api-secondary:3000 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    location ~ ^/(api/|socket\.io/|health/) {
        proxy_pass http://tablemate_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tablemate_connection;
        proxy_read_timeout 75s;
    }
    location = /join {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
